<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Guru</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="header-title">
                <span class="icon">✓</span>
                <h1>ABSENSI GURU</h1>
            </div>

            <div class="tanggal" id="tanggal">
                Memuat tanggal...
            </div>
        </header>

        <main>

            <section class="welcome">
                <div class="welcome-icon">👩‍🏫</div>

                <div>
                    <h2>Selamat Datang!</h2>
                    <p>
                        Silakan isi data di bawah ini untuk
                        mencatat kehadiran mengajar.
                    </p>
                </div>

                <div class="jam">
                    <small>Waktu Sekarang</small>
                    <strong id="jam">00:00:00</strong>
                </div>
            </section>


            <section class="form-card">

                <h2>👤 Form Absensi</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="guru">Nama Guru</label>

                        <select id="guru">
                            <option value="">-- Pilih Guru --</option>
                            <option>Nama Guru 1</option>
                            <option>Nama Guru 2</option>
                            <option>Nama Guru 3</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="kelas">Kelas</label>

                        <select id="kelas">
                            <option value="">-- Pilih Kelas --</option>
                            <option>Kelas I</option>
                            <option>Kelas II</option>
                            <option>Kelas III</option>
                            <option>Kelas IV</option>
                            <option>Kelas V</option>
                            <option>Kelas VI</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="mapel">Mata Pelajaran</label>

                        <select id="mapel">
                            <option value="">-- Pilih Mata Pelajaran --</option>
                            <option>Bahasa Inggris</option>
                            <option>Matematika</option>
                            <option>Bahasa Indonesia</option>
                            <option>IPA</option>
                            <option>IPS</option>
                        </select>
                    </div>

                </div>


                <button onclick="absenMasuk()">
                    ✓ &nbsp; ABSEN MASUK
                </button>


                <div id="hasil"></div>

            </section>

        </main>


        <footer>
            Sistem Absensi Guru<br>
            © 2026 SD Inpres Kenyam
        </footer>

    </div>


    <script>

        function tampilkanWaktu() {

            let sekarang = new Date();

            let jam = sekarang.toLocaleTimeString("id-ID");

            document.getElementById("jam").textContent = jam;

            let tanggal = sekarang.toLocaleDateString("id-ID", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("tanggal").textContent = tanggal;
        }


        setInterval(tampilkanWaktu, 1000);

        tampilkanWaktu();


        function absenMasuk() {

            let guru = document.getElementById("guru").value;
            let kelas = document.getElementById("kelas").value;
            let mapel = document.getElementById("mapel").value;

            if (guru === "" || kelas === "" || mapel === "") {

                alert("Silakan lengkapi semua data terlebih dahulu!");

                return;
            }


            let sekarang = new Date();

            let jam = sekarang.toLocaleTimeString("id-ID", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });


            let tanggal = sekarang.toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });


            document.getElementById("hasil").innerHTML = `

                <div class="success">

                    <div class="success-icon">✓</div>

                    <div class="success-content">

                        <h3>Absensi berhasil!</h3>

                        <p>Berikut detail kehadiran Anda:</p>

                        <div class="detail">

                            <div>
                                <small>Nama Guru</small>
                                <strong>${guru}</strong>
                            </div>

                            <div>
                                <small>Kelas</small>
                                <strong>${kelas}</strong>
                            </div>

                            <div>
                                <small>Mata Pelajaran</small>
                                <strong>${mapel}</strong>
                            </div>

                            <div>
                                <small>Jam Masuk</small>
                                <strong>${jam}</strong>
                            </div>

                            <div>
                                <small>Tanggal</small>
                                <strong>${tanggal}</strong>
                            </div>

                        </div>

                    </div>

                </div>

            `;
        }

    </script>

</body>
</html>
